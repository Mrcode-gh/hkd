<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>GTA Mini</title>
<style>
body{margin:0;background:#000;display:grid;place-items:center;height:100vh;}
canvas{background:#000;border:1px solid #333;}
</style>
</head>
<body>
<canvas id="c" width="480" height="640"></canvas>
<script>
const c=document.getElementById("c"),x=c.getContext("2d");
let player={x:240,y:500,w:40,h:20,speed:5},bullets=[],enemies=[],score=0,gameOver=false;
const keys={};
document.addEventListener("keydown",e=>keys[e.key]=true);
document.addEventListener("keyup",e=>keys[e.key]=false);
function createEnemy(){enemies.push({x:Math.random()*400+40,y:-20,w:40,h:20});}
setInterval(createEnemy,800);
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function loop(){
if(gameOver){x.fillStyle="#f00";x.font="40px sans-serif";x.fillText("GAME OVER",140,300);x.font="20px sans-serif";x.fillText("SCORE "+score,200,360);requestAnimationFrame(loop);return;}
x.fillStyle="#111";x.fillRect(0,0,480,640);
x.fillStyle="#333";x.fillRect(80,0,320,640); // road
// player car
x.fillStyle="#0f0";x.fillRect(player.x,player.y,40,20);
x.fillStyle="#0ff";x.fillRect(player.x+5,player.y+5,15,5);x.fillRect(player.x+20,player.y+5,15,5);
// move
if(keys.ArrowLeft||keys.a)player.x-=player.speed;
if(keys.ArrowRight||keys.d)player.x+=player.speed;
if(keys.ArrowUp||keys.w)player.y-=player.speed;
if(keys.ArrowDown||keys.s)player.y+=player.speed;
player.x=Math.max(60,Math.min(380,player.x));
player.y=Math.max(20,Math.min(580,player.y));
// shoot
if((keys[" "]||keys.e)&&Math.random()<0.3)bullets.push({x:player.x+15,y:player.y,w:6,h:12});
// update
bullets.forEach(b=>b.y-=12);
enemies.forEach(e=>e.y+=3);
// collisions
for(let i=bullets.length-1;i>=0;i--){
let b=bullets[i];
for(let j=enemies.length-1;j>=0;j--){
let e=enemies[j];
if(hit(b,e)){enemies.splice(j,1);bullets.splice(i,1);score++;break;}
}
}
bullets=bullets.filter(b=>b.y>-20);
enemies=enemies.filter(e=>e.y<660);
x.fillStyle="#f00";enemies.forEach(e=>x.fillRect(e.x,e.y,40,20));
x.fillStyle="#ff0";bullets.forEach(b=>x.fillRect(b.x,b.y,6,12));
x.fillStyle="#fff";x.font="20px sans-serif";x.fillText("SCORE: "+score,10,30);
if(enemies.some(e=>hit(e,player)))gameOver=true;
requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
